<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 450" width="100%" height="100%">
  <defs>
    <!-- Sun Gradient -->
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFDE00"/>
      <stop offset="50%" stop-color="#FF9900"/>
      <stop offset="100%" stop-color="#FF6600"/>
    </linearGradient>

    <!-- Ray Gradient -->
    <linearGradient id="rayGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE600"/>
      <stop offset="100%" stop-color="#FF7700"/>
    </linearGradient>

    <!-- Solar Panel Gradient -->
    <linearGradient id="panelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B52C7"/>
      <stop offset="50%" stop-color="#2A3DA6"/>
      <stop offset="100%" stop-color="#18236B"/>
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Drop Shadow Filter -->
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- SUN RAYS BACKGROUND -->
  <g filter="url(#dropShadow)">
    <!-- Outer Ray Flares -->
    <path d="M 250 20 C 265 60, 280 50, 290 80 C 310 50, 325 70, 335 95 C 360 70, 375 90, 375 120 C 405 105, 415 130, 405 155 C 435 150, 440 185, 420 205 C 450 215, 440 250, 415 260 C 435 280, 410 305, 385 300 C 395 325, 365 345, 340 330 C 340 355, 310 365, 290 345 C 280 370, 250 375, 250 350 C 240 375, 210 370, 200 345 C 180 365, 150 355, 150 330 C 130 345, 100 325, 110 300 C 85 305, 60 280, 80 260 C 55 250, 45 215, 75 205 C 55 185, 60 150, 90 155 C 80 130, 90 105, 120 120 C 120 90, 135 70, 160 95 C 170 70, 185 50, 205 80 C 215 50, 230 60, 250 20 Z" fill="url(#rayGrad)" stroke="#111" stroke-width="8" stroke-linejoin="round"/>
    
    <!-- Inner Yellow Sun Disc -->
    <ellipse cx="250" cy="205" rx="140" ry="130" fill="url(#sunGrad)" stroke="#111" stroke-width="7"/>
  </g>

  <!-- ROOF & SOLAR PANEL ASSEMBLY -->
  <g filter="url(#dropShadow)">
    <!-- House Roof Outline (Front Pitch) -->
    <path d="M 125 295 L 250 170 L 440 295 L 400 305 L 250 195 L 155 305 Z" fill="#18236B" stroke="#FFF" stroke-width="8" stroke-linejoin="round"/>
    <path d="M 125 295 L 250 170 L 440 295 L 400 305 L 250 195 L 155 305 Z" fill="none" stroke="#000" stroke-width="4" stroke-linejoin="round"/>

    <!-- Solar Panel Main Body (Perspective Quadrilateral) -->
    <polygon points="170,290 250,180 430,180 410,290" fill="url(#panelGrad)" stroke="#FFF" stroke-width="6" stroke-linejoin="round"/>
    <polygon points="170,290 250,180 430,180 410,290" fill="none" stroke="#000" stroke-width="3" stroke-linejoin="round"/>

    <!-- Solar Panel Cell Grid Lines (Perspective White Lines) -->
    <!-- Horizontal Grid Lines -->
    <line x1="223" y1="210" x2="424" y2="210" stroke="#89A5FF" stroke-width="2.5" opacity="0.8"/>
    <line x1="202" y1="238" x2="419" y2="238" stroke="#89A5FF" stroke-width="2.5" opacity="0.8"/>
    <line x1="184" y1="265" x2="414" y2="265" stroke="#89A5FF" stroke-width="2.5" opacity="0.8"/>

    <!-- Vertical / Angled Grid Lines -->
    <line x1="285" y1="180" x2="220" y2="290" stroke="#89A5FF" stroke-width="2.5" opacity="0.8"/>
    <line x1="320" y1="180" x2="270" y2="290" stroke="#89A5FF" stroke-width="2.5" opacity="0.8"/>
    <line x1="355" y1="180" x2="320" y2="290" stroke="#89A5FF" stroke-width="2.5" opacity="0.8"/>
    <line x1="390" y1="180" x2="365" y2="290" stroke="#89A5FF" stroke-width="2.5" opacity="0.8"/>
  </g>

  <!-- LOGO TYPOGRAPHY "SOLAR RADIANTE" -->
  <g filter="url(#dropShadow)">
    <!-- White Background Shield Behind Text for Maximum Contrast -->
    <path d="M 50 280 C 80 270, 420 270, 450 280 C 470 330, 470 390, 450 420 C 420 435, 80 435, 50 420 C 30 390, 30 330, 50 280 Z" fill="#FFF" stroke="#000" stroke-width="8" stroke-linejoin="round"/>

    <!-- "SOLAR" TEXT -->
    <text x="250" y="340" text-anchor="middle" font-family="'Arial Black', 'Impact', sans-serif" font-weight="900" font-size="62" letter-spacing="4" fill="#000" stroke="#FFF" stroke-width="3">
      SOLAR
    </text>

    <!-- "RADIANTE" TEXT -->
    <text x="250" y="405" text-anchor="middle" font-family="'Arial Black', 'Impact', sans-serif" font-weight="900" font-size="58" letter-spacing="2" fill="#000" stroke="#FFF" stroke-width="3">
      RADIANTE
    </text>
  </g>
</svg>
